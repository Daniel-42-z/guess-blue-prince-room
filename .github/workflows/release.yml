name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0.0)"
        required: true
        default: "v0.1.0.0"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            archive: tar.gz
          - os: macos-latest
            platform: macos-arm64
            archive: tar.gz
          - os: windows-latest
            platform: windows-x86_64
            archive: exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          cabal-version: "latest"

      - name: Update Cabal package index
        run: cabal update

      - name: Run tests
        run: cabal test --disable-executable-dynamic

      - name: Build executable
        run: cabal build exe:guess-blue-prince-room --disable-executable-dynamic

      - name: Package release asset
        shell: bash
        run: |
          mkdir -p release-assets
          BIN_PATH="$(cabal list-bin --disable-executable-dynamic exe:guess-blue-prince-room)"
          if [ "${{ matrix.archive }}" = "exe" ]; then
            cp "$BIN_PATH" "release-assets/guess-blue-prince-room-${{ matrix.platform }}.exe"
            strip "release-assets/guess-blue-prince-room-${{ matrix.platform }}.exe"
          else
            BIN_DIR="$(dirname "$BIN_PATH")"
            BIN_NAME="$(basename "$BIN_PATH")"
            strip "$BIN_PATH"
            tar -czf "release-assets/guess-blue-prince-room-${{ matrix.platform }}.tar.gz" -C "$BIN_DIR" "$BIN_NAME"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.platform }}
          path: release-assets/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          generate_release_notes: true
          files: release-assets/*
